<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Ubah judul halaman sesuai nama aplikasi Anda -->
  <title>Aplikasi Web</title>

  <style>
    /* Reset CSS dasar agar iframe tampil penuh tanpa margin/scrollbar ganda */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Dukungan Tema Gelap Otomatis */
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      .loader-card {
        background-color: #1e293b;
        border-color: #334155;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .loader-subtitle {
        color: #94a3b8;
      }
    }

    /* Container Utama Aplikasi */
    #app-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Mendukung tinggi layar dinamis pada browser mobile */
      z-index: 1;
    }

    /* Iframe Google Apps Script */
    #gas-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    #gas-iframe.loaded {
      opacity: 1;
    }

    /* Layar Pemuatan (Loading Overlay) */
    #loader-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      max-width: 360px;
      width: 100%;
    }

    /* Animasi Spinner Modern */
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .loader-subtitle {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <!-- Indikator Pemuatan Aplikasi -->
  <div id="loader-overlay">
    <div class="loader-card">
      <div class="spinner"></div>
      <div class="loader-title">Aplikasi Web</div>
      <div class="loader-subtitle" id="loader-status">Memuat aplikasi, mohon tunggu sebentar...</div>
    </div>
  </div>

  <!-- Wadah Fullscreen untuk Google Apps Script -->
  <div id="app-wrapper">
    <iframe 
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen" 
      id="gas-iframe" 
      loading="eager" 
      src="https://script.google.com/macros/s/AKfycbzCulBeblOhcarbdkp9Fn_SnvslTYpdXbDXKOAduBTanJQNFqq9y_95ix-LNQ-zarXORg/exec" 
      title="Aplikasi Web">
    </iframe>
  </div>

  <!-- Logika JavaScript untuk Menangani Pemuatan Iframe & Error Handling -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      try {
        const iframe = document.getElementById("gas-iframe");
        const loader = document.getElementById("loader-overlay");
        const statusText = document.getElementById("loader-status");

        // Fungsi untuk menyembunyikan layar pemuatan saat iframe selesai dimuat
        function hideLoader() {
          if (iframe) iframe.classList.add("loaded");
          if (loader) loader.classList.add("hidden");
        }

        // Event listener ketika iframe berhasil memuat konten
        if (iframe) {
          iframe.addEventListener("load", function() {
            // Beri sedikit jeda agar render internal GAS selesai dengan mulus
            setTimeout(hideLoader, 300);
          });
        }

        // Fallback timeout: Jika jaringan lambat (> 5 detik), beri informasi status
        setTimeout(function() {
          if (loader && !loader.classList.contains("hidden")) {
            statusText.textContent = "Koneksi memakan waktu lebih lama dari biasanya...";
          }
        }, 5000);

        // Buka layar otomatis setelah 10 detik agar tidak terjebak di loading screen
        setTimeout(function() {
          if (loader && !loader.classList.contains("hidden")) {
            hideLoader();
          }
        }, 10000);

      } catch (error) {
        console.error("Terjadi kesalahan saat menginisialisasi frame aplikasi:", error);
      }
    });
  </script>
</body>
</html>
